name: melo
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.4+4

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.0.1
  http: ^1.2.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  speech_to_text: ^7.0.0
  blowfish: ^1.0.2
  crypto: ^3.0.3
  dart_des: ^1.0.2
  youtube_explode_dart: ^3.1.0
  share_plus: ^12.0.2
  app_links: ^7.0.0
  video_player: ^2.9.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/ads/
    - asset/onboarding_screen_1_assets/
    - asset/onboarding_screen_2_assets/
    - asset/onboarding_screen_3_assets/
    - asset/socials/
    - asset/profile_icon_page/
    - asset/Genre/
    - asset/Logo/
    - asset/NavBarIcon/
    - asset/album_assets/
    - asset/musicPlayer_assets/
    - asset/YourVibe_assets/
    - asset/Generate_assets/
    - asset/data/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-Black.ttf
          weight: 900
