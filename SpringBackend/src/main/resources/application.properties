spring.application.name=SpringBackend

# H2 Database (for development - switch to MySQL/PostgreSQL for production)
spring.datasource.url=jdbc:h2:mem:melo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Email Configuration (Gmail via Vercel HTTPS Relay & local SMTP fallback)
email.relay-url=${EMAIL_RELAY_URL:https://melo-pi.vercel.app/api/send-email}
email.relay-secret=${EMAIL_RELAY_SECRET:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true 
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Spotify API
spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}

# Groq API
groq.api-key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-120b
groq.api-url=https://api.groq.com/openai/v1/chat/completions

# Tavily Search API (feeds fresh/recent song context to the AI playlist generator)
tavily.api-key=${TAVILY_API_KEY:}
tavily.api-url=https://api.tavily.com/search
tavily.cache-ttl-hours=24

# Server
server.port=${PORT:8080}

# File logging
logging.level.com.melo=INFO

# Async (streaming) request timeout - long songs (>30s) get cut off by the
# container default async timeout, which surfaced as AsyncRequestTimeoutException
# while proxying audio. Raised to 10 minutes.
spring.mvc.async.request-timeout=600000

# Deezer (private API - full-track CDN streaming)
deezer.arl=${DEEZER_ARL:}

